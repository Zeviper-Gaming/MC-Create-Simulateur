[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "createsim"
version = "0.1.0"
description = "Banc d'essai hors-jeu pour vehicules Create (Aeronautics / Simulated / Offroad / Sable)"
requires-python = ">=3.11"
dependencies = ["nbtlib>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.9"]

[project.scripts]
createsim = "createsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
